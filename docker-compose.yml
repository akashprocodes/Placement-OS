services:
  placement-os-postgres:
    image: postgres:17
    container_name: placement-os-postgres
    environment:
      POSTGRES_USER: placement_os
      POSTGRES_PASSWORD: placement_os_dev
      POSTGRES_DB: placement_os
    ports:
      - "5434:5432"
    volumes:
      - placement_os_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_os -d placement_os"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  placement_os_postgres_data:
